name: dispatch-data
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run scripts
        env:
          OUT_DIR: ${{ github.workspace }}
        run: |
          python qnh_local.py
          python notam_status.py
      - name: Commit data
        run: |
          git config user.name "dispatch-bot"
          git config user.email "bot@dispatch"
          git add qnh.js routes.js
          git commit -m "update data" || echo "no change"
          git push
