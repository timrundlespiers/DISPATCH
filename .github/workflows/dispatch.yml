name: dispatch-data
on:
  repository_dispatch:
    types: [data]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run scripts
        env:
          OUT_DIR: ${{ github.workspace }}
        run: |
          for s in qnh_local notam_status; do
            ok=0
            for i in 1 2 3; do
              python $s.py && { ok=1; break; } || sleep 10
            done
            [ $ok -eq 1 ] || echo "$s skipped (network); keeping last data"
          done
      - name: Commit data
        run: |
          git config user.name "dispatch-bot"
          git config user.email "bot@dispatch"
          git add qnh.js routes.js
          git commit -m "update data" || echo "no change"
          for i in 1 2 3; do
            git pull --rebase && git push && break || sleep 5
          done
