name: briefings
on:
  repository_dispatch:
    types: [morning, evening]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Morning briefings
        if: github.event.action == 'morning' || github.event_name == 'workflow_dispatch'
        env:
          WEATHER_WEBHOOK: ${{ secrets.WEATHER_WEBHOOK }}
          NOTAM_WEBHOOK: ${{ secrets.NOTAM_WEBHOOK }}
        run: |
          python briefing.py weather-today
          python briefing.py notams
      - name: Evening forecast
        if: github.event.action == 'evening'
        env:
          WEATHER_WEBHOOK: ${{ secrets.WEATHER_WEBHOOK }}
        run: |
          python briefing.py weather-tomorrow
      - name: Save NOTAM comparison state
        if: always()
        run: |
          git config user.name "dispatch-bot"
          git config user.email "bot@dispatch"
          git pull --rebase || true
          git add -f inside_gstt.json inside_gosh.json
          git commit -m "notam state" || echo "no change"
          git push || echo "push skipped"
