name: briefings
on:
  schedule:
    - cron: '45 6 * * 1-5'
    - cron: '0 15 * * 0-5'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Morning briefings
        if: github.event.schedule == '45 6 * * 1-5'
        env:
          WEATHER_WEBHOOK: ${{ secrets.WEATHER_WEBHOOK }}
          NOTAM_WEBHOOK: ${{ secrets.NOTAM_WEBHOOK }}
        run: |
          python briefing.py weather-today
          python briefing.py notams
      - name: Evening forecast
        if: github.event.schedule == '0 15 * * 0-5'
        env:
          WEATHER_WEBHOOK: ${{ secrets.WEATHER_WEBHOOK }}
        run: |
          python briefing.py weather-tomorrow
      - name: Manual test
        if: github.event_name == 'workflow_dispatch'
        env:
          WEATHER_WEBHOOK: ${{ secrets.WEATHER_WEBHOOK }}
          NOTAM_WEBHOOK: ${{ secrets.NOTAM_WEBHOOK }}
        run: |
          python briefing.py weather-today
          python briefing.py notams
          python briefing.py weather-tomorrow
